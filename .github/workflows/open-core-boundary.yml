name: Open Core Boundary

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - 1.2-maintenance

jobs:
  boundary:
    if: github.repository == 'YuanShiJiLoong/author'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check open-core boundary
        run: npm run check:open-core-boundary

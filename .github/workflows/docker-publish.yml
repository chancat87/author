# ============================================
#  自动构建并发布 Docker 镜像到 Docker Hub
# ============================================
#  触发条件: 推送 v1.2.* 标签或手动触发
#  需要在 GitHub Secrets 中配置:
#    - DOCKERHUB_USERNAME
#    - DOCKERHUB_TOKEN
# ============================================

name: Docker Publish

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v1.2.*'
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the verified image to Docker Hub
        type: boolean
        default: false

jobs:
  verify:
    if: github.repository == 'YuanShiJiLoong/author'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, build, and open-core boundary
        run: npm run check

      - name: Verify scanner and scan source and history
        run: npm run test:secret-scanner && npm run check:secrets && npm run check:secrets:history

  docker:
    # 🔒 仅在原始仓库运行，防止 fork 利用 Secrets
    if: github.repository == 'YuanShiJiLoong/author'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Extract version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build the image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: |
            yuanshijiloong/author:latest
            yuanshijiloong/author:${{ steps.version.outputs.VERSION }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the packaged runtime
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: node scripts/docker-smoke.mjs "yuanshijiloong/author:${IMAGE_VERSION}"

      - name: Scan the image before publication
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm run check:secrets:docker -- "yuanshijiloong/author:${IMAGE_VERSION}"

      - name: Login to Docker Hub
        if: github.event_name == 'push' || inputs.publish_image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the tested image
        if: github.event_name == 'push' || inputs.publish_image
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker push "yuanshijiloong/author:${IMAGE_VERSION}"
          docker push yuanshijiloong/author:latest
